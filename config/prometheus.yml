# config/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [ 'localhost:9090' ]
      # 이건 자기 자신이므로 localhost 사용 가능
  - job_name: spring-actuator
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets: [ app:8080 ]
      # 외부에 있는 컨테이너를 지정하는 것이므로 네트워크로 엮인 서비스 이름을 사용