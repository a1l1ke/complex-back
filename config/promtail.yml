# config/promtail.yml
server:
  # 9080
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  # 어디에 수집한 데이터를 전달할 것이냐 (endpoint)
  - url: http://loki:3100/loki/api/v1/push

# 어떤 데이터를 수집할 것이냐
scrape_configs:
  - job_name: spring-boot-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: spring-boot
          app: complex-back
          __path__: /var/log/app/*.log